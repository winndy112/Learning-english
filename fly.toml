# fly.toml app configuration file generated for learning-english on 2026-05-17T08:47:34Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'learning-english'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[processes]
  app = 'python bot.py'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
